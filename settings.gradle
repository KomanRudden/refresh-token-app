pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    plugins {
        id 'com.gradleup.nmcp' version '1.0.3'
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "RefreshTokenApp"
include ':app'
include ':sdk'
project(':sdk').projectDir = new File('../../kinde-sdk-android/sdk')
