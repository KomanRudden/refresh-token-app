plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.kinde.refreshtokenapp'
    compileSdk compile_version

    defaultConfig {
        applicationId "com.kinde.refreshtokenapp"
        minSdk 23
        targetSdk compile_version
        versionCode 1
        versionName "1.0"
        
        manifestPlaceholders = [appAuthRedirectScheme: 'kinde.sdk://']

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.browser:browser:1.4.0'
    
    // Required for local SDK dependencies
    implementation 'net.openid:appauth:0.11.1'
    implementation 'org.threeten:threetenbp:1.6.1'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    
    // Kinde SDK - using local version
    implementation project(':sdk')
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'
}
